name: Release Installer

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup environment
        id: setup-env
        uses: ./.github/actions/setup-env

      - name: Build and upload installer
        uses: ./.github/actions/build-installer
        with:
          version: ${{ steps.setup-env.outputs.version }}

      - name: Determine release tag
        id: release-tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            "tag=v${{ steps.setup-env.outputs.version }}" >> $env:GITHUB_OUTPUT
          }

      - name: Extract changelog for release
        id: changelog
        shell: pwsh
        run: |
          $content = Get-Content "CHANGELOG.md" -Raw
          $version = "${{ steps.setup-env.outputs.version }}"
          # Try to extract the section for this version
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\].*?(?=^## \[|\z)"
          $match = [regex]::Match($content, $pattern)
          if ($match.Success) {
            $body = $match.Value.Trim()
          } else {
            # Fall back to [Unreleased] section
            $pattern = "(?ms)^## \[Unreleased\].*?(?=^## \[|\z)"
            $match = [regex]::Match($content, $pattern)
            if ($match.Success) {
              $body = $match.Value.Trim()
            } else {
              $body = "See [CHANGELOG.md](https://github.com/AlexNek/DbClone/blob/main/CHANGELOG.md) for details."
            }
          }
          # Write to file to avoid escaping issues
          $body | Out-File -FilePath "release-notes.md" -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          body_path: release-notes.md
          files: |
            artifacts/DbClone-Setup-*.exe
            artifacts/DbClone-*.msi
          generate_release_notes: true
